spring.application.name=feed-service
server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/social_network}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pass}

spring.jpa.properties.hibernate.default_schema=feed
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=true
spring.flyway.schemas=feed
spring.flyway.default-schema=feed
spring.flyway.table=flyway_feed_history

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.issuer=auth-service

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173

app.services.social-graph.url=${SOCIAL_GRAPH_SERVICE_URL:http://localhost:8084}
app.services.post.url=${POST_SERVICE_URL:http://localhost:8087}

management.endpoints.web.exposure.include=health,info

logging.level.org.flywaydb=DEBUG