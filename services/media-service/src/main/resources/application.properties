spring.application.name=media-service
server.port=8083

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/social_network}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pass}

spring.jpa.properties.hibernate.default_schema=media
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.minio.url=${APP_MINIO_URL:http://localhost:9000}
app.minio.public-url=${APP_MINIO_PUBLIC_URL:http://localhost:9000}
app.minio.access-key=${APP_MINIO_ACCESS_KEY:minio}
app.minio.secret-key=${APP_MINIO_SECRET_KEY:minio12345}
app.minio.bucket=${APP_MINIO_BUCKET:media}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.issuer=auth-service

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173

spring.flyway.enabled=true
spring.flyway.schemas=media
spring.flyway.default-schema=media
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=true
spring.flyway.table=flyway_schema_history
